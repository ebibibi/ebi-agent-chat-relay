[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-code-discord-bridge"
version = "4.1.4"
description = "Ebi Agent Chat Relay — run Claude Code, Codex, local, and AG-UI agents from Discord or Microsoft Teams"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.14"
dependencies = [
    "discord.py>=2.7.1,<3.0",
    "aiosqlite>=0.20,<1.0",
    "python-dotenv>=1.2.2,<2.0",
]

[project.optional-dependencies]
api = ["aiohttp>=3.14.3"]
agui = ["aiohttp>=3.14.3"]
images = ["pillow>=12.3.0"]
# The Teams frontend needs an inbound HTTPS listener and asymmetric JWT
# verification. Discord deployments never call either, so they are not made to
# carry them.
teams = ["aiohttp>=3.14.3", "pyjwt[crypto]>=2.13.0,<3.0", "defusedxml>=0.7,<1.0"]

[project.scripts]
ccdb = "claude_discord.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["claude_discord", "claude_code_core", "claude_teams"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "aiohttp>=3.14.3",
    "pyright>=1.1.411",
    "pillow>=12.3.0",
    "pyjwt[crypto]>=2.13.0,<3.0",
    "defusedxml>=0.7,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_system_context: opt out of the _build_system_context autouse patch",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.coverage.report]
# Exclude lines that don't need coverage (type stubs, abstract methods, etc.)
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
