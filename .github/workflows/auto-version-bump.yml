name: Auto Patch Version Bump

# Triggered by post-merge.yml after a non-docs-sync PR is merged.
# The rule this whole file is shaped by: docs/merge-events.md. Owner PRs are
# merged with ADMIN_PAT so GitHub emits the main push event; post-merge.yml then
# converts that event into this explicit repository_dispatch.
#
# Two modes, determined by PR title:
#   [release] in title → tag & release the current version as-is (no bump)
#   anything else      → open a bump PR against main; no tag/release
#
# Why a PR and not a direct push (issue #725):
#   The `issue-driven-main` ruleset is created with an empty bypass_actors
#   list on purpose, so nobody — not a repository admin, and therefore not
#   ADMIN_PAT either — can push to main or merge a PR with no linked issue.
#   Direct pushes have been rejected with GH013 since 2026-09-17.
#
# Why this PR-based attempt differs from the two that were reverted (#169,
# #230): both created the PR with GITHUB_TOKEN, and GitHub suppresses
# pull_request events from that token, so neither CI nor auto-approve ever
# ran and the required checks stayed "Expected" forever. Here ADMIN_PAT
# *authors* the branch, issue and PR as a real user, which does fire those
# events. It is used to satisfy the rules, not to bypass them.
on:
  repository_dispatch:
    types: [pr-merged]

# Serialise bumps so that two merges landing at once cannot race to create
# the same auto/bump-* branch.
concurrency:
  group: auto-version-bump
  cancel-in-progress: false

jobs:
  version-bump:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_PAT }}

      - name: Detect release mode from PR title
        id: mode
        env:
          PR_TITLE: ${{ github.event.client_payload.pr_title }}
        run: |
          if [[ "$PR_TITLE" == *"[release]"* ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Mode: release (tag current version as-is)"
          else
            echo "mode=patch-bump" >> "$GITHUB_OUTPUT"
            echo "Mode: patch-bump (open a bump PR)"
          fi

      - name: Read current version
        id: read
        run: |
          CURRENT=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          MODE="${{ steps.mode.outputs.mode }}"

          if [ "$MODE" = "release" ]; then
            RELEASE_VERSION="$CURRENT"
            echo "Tagging current version: $RELEASE_VERSION"
          else
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            RELEASE_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
            echo "Bumping $CURRENT -> $RELEASE_VERSION"
          fi

          echo "current=$CURRENT"                >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$RELEASE_VERSION"    >> "$GITHUB_OUTPUT"

      - name: Skip when a bump PR is already open
        id: existing
        if: steps.mode.outputs.mode == 'patch-bump'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          set -euo pipefail
          # Filtered locally rather than with the `head:` search qualifier,
          # which matches whole branch names and not this prefix.
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName --limit 100 \
            --jq '[.[] | select(.headRefName | startswith("auto/bump-"))]')

          if [ "$(echo "$OPEN" | jq length)" -gt 0 ]; then
            # main has not moved while that PR is open, so it already targets
            # the exact version this run would produce. Merges that land in
            # the meantime collapse into one patch bump, which is intended.
            NUMBER=$(echo "$OPEN" | jq -r '.[0].number')
            echo "::notice::Bump PR #$NUMBER is already open; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open bump PR (patch-bump mode)
        if: steps.mode.outputs.mode == 'patch-bump' && steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
          CURRENT: ${{ steps.read.outputs.current }}
          RELEASE_VERSION: ${{ steps.read.outputs.release_version }}
        run: |
          set -euo pipefail
          BRANCH="auto/bump-v$RELEASE_VERSION"

          sed -i "s/^version = \"$CURRENT\"/version = \"$RELEASE_VERSION\"/" pyproject.toml
          # Matched by position in the editable entry, not by the version it
          # currently holds: a manual release that touches pyproject.toml and
          # forgets uv.lock leaves the two out of step, and a sed keyed on
          # $CURRENT then silently matches nothing and wedges every bump
          # afterwards. This rewrite also repairs that drift.
          sed -i \
            "/^name = \"claude-code-discord-bridge\"$/,/^source = { editable = \"\.\" }$/ s/^version = \".*\"$/version = \"$RELEASE_VERSION\"/" \
            uv.lock

          if ! grep -A2 '^name = "claude-code-discord-bridge"$' uv.lock \
            | grep -Fxq "version = \"$RELEASE_VERSION\""; then
            echo "Failed to synchronize the editable project version in uv.lock" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add pyproject.toml uv.lock
          git commit -m "chore: bump version to $RELEASE_VERSION"
          # --force-with-lease so a branch left behind by an abandoned run
          # cannot block the push, while a branch someone else advanced does.
          git push --force-with-lease origin "$BRANCH"

          # The ruleset requires every PR to close an issue, and the exemption
          # in require-linked-issue.yml only covers bot authors. This PR is
          # authored by the PAT owner, so it needs an issue of its own. Created
          # only once the branch is up, so a failed push leaves no orphan.
          ISSUE_BODY=$(printf '%s\n' \
            "Automated patch bump from \`$CURRENT\` to \`$RELEASE_VERSION\` after a PR merge." \
            "" \
            "Opened by \`auto-version-bump.yml\`; the bump PR that closes it follows immediately.")

          ISSUE_URL=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "chore: bump version to $RELEASE_VERSION" \
            --body "$ISSUE_BODY")
          ISSUE_NUMBER="${ISSUE_URL##*/}"
          echo "Created issue #$ISSUE_NUMBER"

          PR_BODY=$(printf '%s\n' \
            "Automated patch bump from \`$CURRENT\` to \`$RELEASE_VERSION\`." \
            "" \
            "Closes #$ISSUE_NUMBER")

          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump version to $RELEASE_VERSION" \
            --body "$PR_BODY"

          echo "Opened bump PR for $RELEASE_VERSION"

      - name: Create tag and GitHub Release
        # Uses ADMIN_PAT so the release event triggers docs-translate.yml.
        # GITHUB_TOKEN-created releases do NOT fire on.release events (GitHub anti-recursion).
        if: steps.mode.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
          RELEASE_TAG: ${{ steps.read.outputs.release_tag }}
        run: |
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/main" --jq '.object.sha')

          # Create tag (idempotent)
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists, skipping"
          else
            jq -c -n \
              --arg ref "refs/tags/$RELEASE_TAG" \
              --arg sha "$TAG_SHA" \
              '{ref: $ref, sha: $sha}' \
            | gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              --method POST \
              --input -
            echo "Created tag $RELEASE_TAG -> $TAG_SHA"
          fi

          # Create release (idempotent)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, skipping"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --latest
            echo "Released $RELEASE_TAG"
          fi

      - name: Notify えびログ (Discord)
        if: steps.mode.outputs.mode == 'release'
        env:
          EBILOG_WEBHOOK_URL: ${{ secrets.EBILOG_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.read.outputs.release_tag }}
        run: |
          if [ -z "$EBILOG_WEBHOOK_URL" ]; then
            echo "EBILOG_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          MESSAGE="🚀 **claude-code-discord-bridge $RELEASE_TAG** リリースしました！\n$RELEASE_URL"
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"$MESSAGE\"}" \
            "$EBILOG_WEBHOOK_URL"
          echo "Notified えびログ"
