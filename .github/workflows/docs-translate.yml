name: Documentation Translation (All Languages)

on:
  release:
    types: [published]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  trigger-docs-translate:
    # Full translation runs for minor/major releases (X.Y.0) only; every merge
    # is published as a patch release and docs-sync already keeps ja current.
    if: github.event_name == 'workflow_dispatch' || endsWith(github.event.release.tag_name, '.0')
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Trigger full translation via Discord webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOCS_SYNC_WEBHOOK_URL }}
        run: |
          # Full translation to all languages (ja, zh-CN, ko, es, pt-BR, fr)
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"content":"🔄 docs-sync-translate"}' \
            "$WEBHOOK_URL"
