name: Auto Approve Owner PRs
on:
  pull_request:
    # ready_for_review: fires when a draft PR is converted to ready — this is
    # the intended trigger for multi-commit workflows where the PR is opened
    # as a draft, all commits are pushed, and then the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel any in-progress run for the same PR when a new commit is pushed
# (synchronize event). This prevents stale polling loops from an earlier
# commit competing with a fresh run while new CI checks are still pending.
concurrency:
  group: auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-approve-and-merge:
    # Skip draft PRs — only auto-merge when the PR is explicitly marked ready.
    # This prevents the race condition where auto-merge fires on the first
    # commit before subsequent commits have been pushed.
    # Skip 'external-issue' PRs — these are created from external user Issues via
    # Docker sandbox and require manual review before merging.
    if: >
      github.event.pull_request.user.login == 'ebibibi' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'external-issue')
    # This control-plane job polls for required checks. Running it on the same
    # single-capacity JIT pool as CI can starve the checks it is waiting for.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --approve
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
      - name: Wait for merge and notify EbiBot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WEBHOOK_URL: ${{ secrets.DOCS_SYNC_WEBHOOK_URL }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # GITHUB_TOKEN merges don't trigger other workflows (push/PR events).
          # So we poll for merge completion and send the webhooks directly.
          # Poll for up to 15 minutes (90 × 10s) to accommodate CI runs that
          # start after fix commits are pushed (synchronize event).
          for i in $(seq 1 90); do
            STATE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state -q .state)
            if [ "$STATE" = "MERGED" ]; then
              # --- EbiBot upgrade webhook (skip for docs-sync and auto-bump PRs) ---
              if [[ "$HEAD_REF" != docs-sync/* ]] && [[ "$PR_TITLE" != '[docs-sync]'* ]] && [[ "$HEAD_REF" != auto/bump-* ]]; then
                echo "PR merged! Sending upgrade webhook..."
                curl -s -o /dev/null -w "%{http_code}" \
                  -H "Content-Type: application/json" \
                  -d '{"content":"🔄 ebibot-upgrade"}' \
                  "$WEBHOOK_URL"
              else
                echo "Skipping upgrade: docs-sync or auto-bump PR ($HEAD_REF)"
              fi

              # --- Docs-sync webhook (skip for docs-sync and auto-bump PRs) ---
              if [[ "$HEAD_REF" != docs-sync/* ]] && [[ "$PR_TITLE" != '[docs-sync]'* ]] && [[ "$HEAD_REF" != auto/bump-* ]]; then
                OPEN_PR=$(gh pr list \
                  --repo "$GITHUB_REPOSITORY" \
                  --state open \
                  --search "head:docs-sync/" \
                  --json number \
                  --limit 1)
                if [ "$(echo "$OPEN_PR" | jq length)" -eq 0 ]; then
                  echo "Sending docs-sync webhook..."
                  curl -s -o /dev/null -w "%{http_code}" \
                    -H "Content-Type: application/json" \
                    -d '{"content":"🔄 docs-sync"}' \
                    "$WEBHOOK_URL"
                else
                  echo "Skipping docs-sync: docs-sync PR already open"
                fi
              else
                echo "Skipping docs-sync: excluded branch ($HEAD_REF)"
              fi

              # --- Version bump dispatch (skip for docs-sync and auto-bump PRs) ---
              # auto/bump-* PRs carry the bump itself. Dispatching on their
              # merge would open a bump PR for the bump, forever (issue #725).
              if [[ "$HEAD_REF" != docs-sync/* ]] && [[ "$PR_TITLE" != '[docs-sync]'* ]] && [[ "$HEAD_REF" != auto/bump-* ]]; then
                echo "Dispatching pr-merged event for version bump..."
                DISPATCH_PAYLOAD=$(jq -c -n \
                  --arg event_type "pr-merged" \
                  --arg pr_number "$PR_NUMBER" \
                  --arg pr_title "$PR_TITLE" \
                  '{event_type: $event_type, client_payload: {pr_number: $pr_number, pr_title: $pr_title}}')
                echo "$DISPATCH_PAYLOAD" | gh api "repos/$GITHUB_REPOSITORY/dispatches" \
                  --method POST \
                  --input -
              else
                echo "Skipping version bump: docs-sync PR ($HEAD_REF)"
              fi

              exit 0
            fi
            echo "Waiting for merge... ($i/90)"
            sleep 10
          done
          echo "PR not merged within 15 minutes, skipping webhook"

  auto-merge-dependabot:
    # Auto-merge Dependabot PRs once CI passes — but only patch/minor bumps.
    # Major version bumps may carry breaking changes, so they are flagged for a
    # human (or Claude) to review instead of merging automatically.
    #
    # This is a SEPARATE job from auto-approve-and-merge on purpose: the owner
    # job is gated on user.login == 'ebibibi' and carries the EbiBot-restart
    # webhook + version-bump dispatch. Dependabot PRs must NOT trigger those —
    # the lock change reaches the running bot on its next natural restart via
    # pre-start.sh (uv sync), so no disruptive restart is needed here.
    #
    # Security: only non-major updates are merged, and the repository Ruleset's
    # required status checks (CI on 3 Python versions) must pass before --auto
    # completes the merge.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: [self-hosted, linux, x64]
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Approve and enable auto-merge (skip major bumps)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --approve
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
      - name: Flag major bumps for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "⚠️ Major version bump — not auto-merged. Review for breaking changes before merging."
