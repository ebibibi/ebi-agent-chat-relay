name: Post-merge automation

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  post-merge:
    # This job reacts to the push emitted by an owner-attributed merge. Keep it
    # off the single-capacity test pool: it only calls GitHub and Discord APIs.
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the pull request that produced this commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          MAX_PR_LOOKUP_ATTEMPTS=12
          PR=""
          PR_NUMBER=""
          PR_TITLE=""
          HEAD_REF=""

          for attempt in $(seq 1 "$MAX_PR_LOOKUP_ATTEMPTS"); do
            ASSOCIATED_PRS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              2>/dev/null || true)
            CANDIDATE_NUMBER=$(printf '%s' "$ASSOCIATED_PRS" | jq -r \
              --arg sha "$GITHUB_SHA" \
              '[.[]? | select(.base.ref == "main" and .merged_at != null
                              and .merge_commit_sha == $sha)]
               | sort_by(.merged_at) | last.number // empty' 2>/dev/null || true)

            if [ -n "$CANDIDATE_NUMBER" ]; then
              PR=$(gh pr view "$CANDIDATE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --json number,title,headRefName,baseRefName,mergedAt,mergeCommit \
                2>/dev/null || true)
              if printf '%s' "$PR" | jq -e --arg sha "$GITHUB_SHA" \
                '.baseRefName == "main" and .mergedAt != null
                 and .mergeCommit.oid == $sha' >/dev/null 2>&1; then
                PR_NUMBER=$(printf '%s' "$PR" | jq -r '.number')
                PR_TITLE=$(printf '%s' "$PR" | jq -r '.title')
                HEAD_REF=$(printf '%s' "$PR" | jq -r '.headRefName')
                break
              fi
            fi

            if [ "$attempt" -lt "$MAX_PR_LOOKUP_ATTEMPTS" ]; then
              sleep 10
            fi
          done

          if [ -z "$PR_NUMBER" ]; then
            # The push can arrive before the commits/{sha}/pulls index is ready.
            # Only an explicit PR reference earns the idempotent upgrade fallback.
            COMMIT_MESSAGE=$(jq -r ".head_commit.message // \"\"" "$GITHUB_EVENT_PATH")
            COMMIT_SUBJECT=${COMMIT_MESSAGE%%$'\n'*}
            PR_NUMBER=$(printf '%s\n' "$COMMIT_SUBJECT" \
              | sed -nE 's/.*\(#([0-9]+)\).*/\1/p')

            if [ -n "$PR_NUMBER" ]; then
              PR=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --json number,title,headRefName,baseRefName,mergedAt,mergeCommit \
                2>/dev/null || true)
              if printf '%s' "$PR" | jq -e --arg sha "$GITHUB_SHA" \
                '.baseRefName == "main" and .mergedAt != null
                 and .mergeCommit.oid == $sha' >/dev/null 2>&1; then
                PR_NUMBER=$(printf '%s' "$PR" | jq -r '.number')
                PR_TITLE=$(printf '%s' "$PR" | jq -r '.title')
                HEAD_REF=$(printf '%s' "$PR" | jq -r '.headRefName')
              else
                echo "::notice::PR #$PR_NUMBER is referenced but not confirmed as the merged main PR for $GITHUB_SHA; allowing upgrade only."
                echo "verified=false" >> "$GITHUB_OUTPUT"
                echo "found=false" >> "$GITHUB_OUTPUT"
                echo "unresolved=true" >> "$GITHUB_OUTPUT"
                echo "upgrade_only=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "::notice::No PR reference in commit subject; nothing to do for $GITHUB_SHA."
              echo "verified=false" >> "$GITHUB_OUTPUT"
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "unresolved=false" >> "$GITHUB_OUTPUT"
              echo "upgrade_only=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "unresolved=false" >> "$GITHUB_OUTPUT"
          echo "upgrade_only=false" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "title=$PR_TITLE" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Classify the merged pull request
        id: classify
        if: steps.pr.outputs.verified == 'true'
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: |
          if [[ "$HEAD_REF" == auto/bump-* ]]; then
            # The bump itself is what gets released; nothing else to do for it.
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Bump PR merged: releasing it"
          elif [[ "$HEAD_REF" == docs-sync/* ]] \
            || [[ "$PR_TITLE" == '[docs-sync]'* ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Skipping post-merge work for excluded PR: $HEAD_REF"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger EbiBot upgrade
        if: >-
          steps.classify.outputs.eligible == 'true' ||
          (steps.pr.outputs.unresolved == 'true' && steps.pr.outputs.upgrade_only == 'true')
        env:
          WEBHOOK_URL: ${{ secrets.DOCS_SYNC_WEBHOOK_URL }}
        run: |
          curl --fail-with-body -sS -o /dev/null \
            -H "Content-Type: application/json" \
            -d '{"content":"🔄 ebibot-upgrade"}' \
            "$WEBHOOK_URL"

      - name: Check whether docs-sync is already active
        id: docs
        if: steps.classify.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OPEN_PR=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "head:docs-sync/" \
            --json number \
            --limit 1)

          if [ "$(echo "$OPEN_PR" | jq length)" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping docs-sync: docs-sync PR already open"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger docs-sync
        if: steps.classify.outputs.eligible == 'true' && steps.docs.outputs.skip != 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DOCS_SYNC_WEBHOOK_URL }}
        run: |
          curl --fail-with-body -sS -o /dev/null \
            -H "Content-Type: application/json" \
            -d '{"content":"🔄 docs-sync"}' \
            "$WEBHOOK_URL"

      - name: Dispatch the patch version bump or release
        if: steps.classify.outputs.eligible == 'true' || steps.classify.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          RELEASE: ${{ steps.classify.outputs.release == 'true' }}
        run: |
          jq -c -n \
            --arg event_type "pr-merged" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            --arg release "$RELEASE" \
            --arg sha "$GITHUB_SHA" \
            '{event_type: $event_type,
              client_payload: {pr_number: $pr_number, pr_title: $pr_title,
                               release: $release, sha: $sha}}' \
          | gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST --input -
